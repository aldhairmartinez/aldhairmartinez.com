services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://10.0.0.30:3000
      - OTEL_SERVICE_NAME=aldhairmartinez-backend
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=aldhairmartinez-com,deployment.environment=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
    depends_on:
      alloy:
        condition: service_started
      postgres:
        condition: service_healthy

  alloy:
    image: grafana/alloy:v1.19.2
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    env_file:
      - ./alloy/.env
    ports:
      - "12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy

  postgres:
    image: postgres:18.6
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
